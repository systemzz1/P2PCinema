<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P2P Cinema - Guest</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/guest.css">
  <script src="/js/theme.js"></script>
</head>

<body>

  <div class="screen-wrapper" id="screenWrapper">
    <div class="video-container" id="videoContainer">
      <div id="stats-overlay" style="display: none; position: absolute; top: 20px; right: 20px; background: var(--bg-panel); backdrop-filter: blur(10px); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); color: #4ade80; font-size: 13px; font-family: monospace; z-index: 999; box-shadow: 0 10px 30px var(--shadow-color);">
        <div>Resolution: <span id="statRes">N/A</span></div>
        <div>Framerate: <span id="statFps">N/A</span></div>
        <div>Bitrate: <span id="statBitrate">N/A</span></div>
      </div>

      <!-- Stream Title Overlay -->
      <div id="streamTitleDisplay" style="position: absolute; top: 20px; left: 20px; z-index: 10; background: var(--bg-panel); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-color); color: var(--text-primary); font-weight: bold; font-size: 18px; text-shadow: 0 2px 4px var(--shadow-color); display: none; align-items: center; gap: 10px; max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
        <span style="display:inline-block; width: 10px; height: 10px; background: var(--accent-color); border-radius: 50%; box-shadow: 0 0 8px var(--accent-color);"></span>
        <span id="streamTitleText">Waiting for Host...</span>
      </div>

      <!-- Trivia Card Overlay (Bottom Left) -->
      <div id="triviaCardOverlay" style="position: absolute; bottom: 80px; left: -450px; z-index: 100; width: 350px; background: var(--bg-panel); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 15px 40px var(--shadow-color); transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column;">
        <button id="closeTriviaBtn" style="position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer;">&times;</button>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px; color: var(--accent-color); font-weight: bold; font-size: 14px;">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          DID YOU KNOW?
        </div>
        <div style="display: flex; gap: 15px; align-items: flex-start;">
          <img id="triviaCardImg" src="" style="width: 80px; height: 120px; object-fit: cover; border-radius: 8px; display: none; box-shadow: 0 5px 15px var(--shadow-color);">
          <div>
            <h4 id="triviaCardTitle" style="margin-top: 0; margin-bottom: 5px; color: var(--text-primary); font-size: 16px;"></h4>
            <p id="triviaCardText" style="font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 0; max-height: 100px; overflow-y: auto; padding-right: 5px;"></p>
          </div>
        </div>
      </div>

      <div class="theater-overlay" id="theaterNotice">Waiting for Host to start...</div>

      <div class="stats-overlay" id="statsOverlay" style="display: none;">
        <div>Resolution: <span id="statRes">--</span></div>
        <div>Bitrate: <span id="statBitrate">0 kbps</span></div>
        <div>Packet Loss: <span id="statLoss">0</span>%</div>
        <div>Latency: <span id="statPing">--</span> ms</div>
      </div>

      <button class="big-play-btn" id="joinStreamBtn" style="display: none;">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>

      <div id="bufferingOverlay" style="position: absolute; inset: 0; background: #000; z-index: 25; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; transition: opacity 0.5s ease;">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: bold; color: var(--text-secondary); font-size: 16px;">Buffering Stream... 🍿</p>
      </div>

      <video id="theaterPlayer" playsinline></video>

      <div class="controls-bar" id="controlsBar" style="display: none;">
        <div class="left-controls">
          <button class="icon-btn wifi-icon wifi-excellent" id="syncStatusIcon" title="Connection Status">
            <svg viewBox="0 0 24 24">
              <path d="M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01.01-.01z" />
            </svg>
          </button>
          <button class="icon-btn" id="refreshStreamBtn" title="Reload Stream Connection">
            <svg viewBox="0 0 24 24">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
        </div>
        <div class="right-controls">
          <button class="icon-btn" id="statsToggleBtn" title="Network Stats">
            <svg viewBox="0 0 24 24">
              <path
                d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" />
            </svg>
          </button>
          <button class="icon-btn" id="pipBtn" title="Picture-in-Picture">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z" />
            </svg>
          </button>
          <div class="volume-container">
            <button class="icon-btn" id="muteToggleBtn">
              <svg viewBox="0 0 24 24">
                <path
                  d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
              </svg>
            </button>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
          </div>
          <button class="icon-btn" id="playerChatToggleBtn" title="Toggle Chat">
            <svg viewBox="0 0 24 24">
              <path
                d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" />
            </svg>
          </button>
          <button class="icon-btn" id="disconnectBtn" title="Stop Watching (Space)">
            <svg viewBox="0 0 24 24" style="fill: #ef4444;">
              <path
                d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
            </svg>
          </button>
          <button class="icon-btn" id="fullscreenBtn" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="chat-panel" id="chatPanel" style="display: none;">
      <div class="chat-header">
        <h3>Room Chat</h3>
        <button class="icon-btn" id="closeChatBtn"><svg viewBox="0 0 24 24">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg></button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <button id="togglePickerBtn" title="Toggle Emotes & Sounds" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 5px;">😃</button>
        <input type="text" id="chatInput" placeholder="Send a message...">
        <button id="sendChatBtn"><svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg></button>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/identity.js"></script>
  <script type="module" src="/js/guest/main.js"></script>
  <script type="module" src="/js/chat.js"></script>
</body>

</html>
